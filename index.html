<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYB Institutional Yield Farm | Mobile Optimized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #030304; color: #ffffff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .gold-grad-card { background: linear-gradient(135deg, rgba(243, 186, 47, 0.05) 0%, rgba(217, 119, 6, 0.15) 100%); border: 1px solid rgba(243, 186, 47, 0.2); border-radius: 24px; }
        .gold-button { background: linear-gradient(90deg, #f3ba2f 0%, #d97706 100%); color: #000; font-weight: 800; border-radius: 12px; transition: 0.3s; }
        .gold-button:active { transform: scale(0.95); }
        .input-dark { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px; padding: 12px; text-align: center; width: 100%; }
        .nav-glass { background: rgba(3, 3, 4, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="nav-glass p-5 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-[#f3ba2f] rounded-lg flex items-center justify-center font-black text-black">A</div>
            <h1 class="text-xl font-black tracking-tighter">AYB <span class="text-[#f3ba2f]">PROTOCOL</span></h1>
        </div>
        <button id="connectBtn" class="gold-button px-5 py-2 text-xs uppercase tracking-widest">Connect Wallet</button>
    </nav>

    <div class="max-w-4xl mx-auto px-4 mt-8">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="gold-grad-card p-5 text-center">
                <p class="text-[10px] uppercase text-gray-500 mb-1">Total TVL</p>
                <h2 id="tvlDisplay" class="text-lg font-bold">0.00</h2>
            </div>
            <div class="gold-grad-card p-5 text-center border-[#f3ba2f]/40">
                <p class="text-[10px] uppercase text-gray-500 mb-1">Rewards</p>
                <h2 id="pendingRewards" class="text-lg font-bold text-[#f3ba2f]">0.0000</h2>
            </div>
            <div class="gold-grad-card p-5 text-center">
                <p class="text-[10px] uppercase text-gray-500 mb-1">Your Stake</p>
                <h2 id="myStakeDisplay" class="text-lg font-bold">0.00</h2>
            </div>
            <div class="gold-grad-card p-5 text-center">
                <p class="text-[10px] uppercase text-gray-500 mb-1">Wallet</p>
                <h2 id="balanceInfo" class="text-lg font-bold">0.00</h2>
            </div>
        </div>

        <div class="flex gap-4 mb-10">
            <button onclick="claimRewards()" class="flex-1 py-3 bg-white/5 border border-white/10 rounded-xl text-xs font-bold hover:bg-white/10">Claim Earnings</button>
            <button onclick="withdrawAll()" class="flex-1 py-3 bg-red-900/20 border border-red-900/40 rounded-xl text-xs font-bold text-red-400">Emergency Exit</button>
        </div>

        <div class="space-y-6 mb-12">
            <div class="gold-grad-card p-6 flex flex-col md:flex-row items-center justify-between gap-6 border-t-4 border-orange-500">
                <div>
                    <h4 class="font-black text-orange-500">BRONZE POOL</h4>
                    <p class="text-3xl font-black">15% APY</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <input type="number" id="input0" placeholder="Amount" class="input-dark">
                    <button onclick="stake(0)" class="gold-button px-8 py-3 uppercase text-xs">Stake</button>
                </div>
            </div>

            <div class="gold-grad-card p-6 flex flex-col md:flex-row items-center justify-between gap-6 border-t-4 border-white relative">
                <div class="absolute -top-3 right-6 bg-white text-black text-[8px] font-black px-3 py-1 rounded-full uppercase">Popular</div>
                <div>
                    <h4 class="font-black text-gray-300">SILVER POOL</h4>
                    <p class="text-3xl font-black">35% APY</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <input type="number" id="input1" placeholder="Amount" class="input-dark">
                    <button onclick="stake(1)" class="gold-button px-8 py-3 uppercase text-xs">Stake</button>
                </div>
            </div>

            <div class="gold-grad-card p-6 flex flex-col md:flex-row items-center justify-between gap-6 border-t-4 border-[#f3ba2f]">
                <div>
                    <h4 class="font-black text-[#f3ba2f]">GOLD POOL</h4>
                    <p class="text-3xl font-black">80% APY</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <input type="number" id="input2" placeholder="Amount" class="input-dark">
                    <button onclick="stake(2)" class="gold-button px-8 py-3 uppercase text-xs">Stake</button>
                </div>
            </div>
        </div>

        <div class="gold-grad-card p-8 text-center border-dashed border-white/20">
            <h3 class="text-sm font-bold uppercase tracking-widest mb-4">Referral Link</h3>
            <div class="flex items-center gap-2 bg-black/40 p-2 rounded-xl border border-white/5">
                <input id="refUrl" readonly class="bg-transparent flex-1 px-4 text-[10px] text-gray-400 outline-none" value="Connect wallet to generate">
                <button onclick="copyRef()" class="gold-button px-4 py-2 text-[10px]">COPY</button>
            </div>
        </div>
    </div>

    <script>
        const STAKING_CA = "0xc012526f102e7b5F98Dce33a989e803b232D0AB7";
        const TOKEN_CA = "0x4b8D134A91405F8Dd3bc679F5B2b0B9283Cb7e15";
        const ARBITRUM_CHAIN_ID = "0xa4b1"; // Arbitrum One

        const FARM_ABI = [
            "function stake(uint256 _amount, uint256 _tier, address _referrer) external",
            "function claim() external",
            "function withdraw(uint256 _amount) external",
            "function pendingRewards(address _user) view returns (uint256)",
            "function totalStaked() view returns (uint256)",
            "function users(address) view returns (uint256 amount, uint256 lastStakeTime, address referrer, uint256 tier)"
        ];
        const TOKEN_ABI = ["function balanceOf(address) view returns (uint256)", "function approve(address spender, uint256 amount) returns (bool)"];

        let signer, farmContract, tokenContract;

        async function connect() {
            if (!window.ethereum) {
                // If on mobile and no ethereum provider, try to open MetaMask App
                const dappUrl = window.location.href.split('://')[1];
                window.location.href = `https://metamask.app.link/dapp/${dappUrl}`;
                return;
            }

            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                
                // Ensure Arbitrum Network
                const { chainId } = await provider.getNetwork();
                if (chainId !== 42161) {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: ARBITRUM_CHAIN_ID }],
                    });
                }

                signer = provider.getSigner();
                const address = await signer.getAddress();
                
                farmContract = new ethers.Contract(STAKING_CA, FARM_ABI, signer);
                tokenContract = new ethers.Contract(TOKEN_CA, TOKEN_ABI, signer);

                document.getElementById('connectBtn').innerText = address.slice(0,6) + "...";
                document.getElementById('refUrl').value = window.location.origin + window.location.pathname + "?ref=" + address;
                
                loadData();
                setInterval(loadData, 8000);
            } catch (err) { console.error(err); }
        }

        async function loadData() {
            const user = await signer.getAddress();
            const [bal, pending, total, userObj] = await Promise.all([
                tokenContract.balanceOf(user),
                farmContract.pendingRewards(user),
                farmContract.totalStaked(),
                farmContract.users(user)
            ]);

            document.getElementById('tvlDisplay').innerText = parseFloat(ethers.utils.formatEther(total)).toFixed(0);
            document.getElementById('pendingRewards').innerText = parseFloat(ethers.utils.formatEther(pending)).toFixed(4);
            document.getElementById('myStakeDisplay').innerText = parseFloat(ethers.utils.formatEther(userObj.amount)).toFixed(0);
            document.getElementById('balanceInfo').innerText = parseFloat(ethers.utils.formatEther(bal)).toFixed(0);
        }

        async function stake(tier) {
            const val = document.getElementById('input' + tier).value;
            if(!val || val <= 0) return alert("Enter amount");
            const amount = ethers.utils.parseEther(val);
            const ref = new URLSearchParams(window.location.search).get('ref') || "0x0000000000000000000000000000000000000000";

            try {
                const appTx = await tokenContract.approve(STAKING_CA, amount);
                await appTx.wait();
                const tx = await farmContract.stake(amount, tier, ref);
                await tx.wait();
                alert("Staking Successful!");
            } catch (err) { alert(err.message); }
        }

        async function claimRewards() {
            try { await (await farmContract.claim()).wait(); alert("Claimed!"); } catch (err) { alert(err.message); }
        }

        async function withdrawAll() {
            try {
                const user = await signer.getAddress();
                const userObj = await farmContract.users(user);
                await (await farmContract.withdraw(userObj.amount)).wait();
                alert("Withdrawn!");
            } catch (err) { alert(err.message); }
        }

        function copyRef() {
            navigator.clipboard.writeText(document.getElementById('refUrl').value);
            alert("Copied!");
        }

        document.getElementById('connectBtn').onclick = connect;
    </script>
</body>
</html>
